<!DOCTYPE html>
<html lang="ru" data-theme="teal" data-mode="light">
<head>
  <meta charset="UTF-8" />
  <script>
  (function () {
    try {
      var mode = localStorage.getItem('mk_mode') || 'system';
      var theme = localStorage.getItem('mk_theme') || 'teal';
      var dark = mode === 'dark' ||
        (mode === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
      var r = document.documentElement;
      r.setAttribute('data-mode', dark ? 'dark' : 'light');
      r.setAttribute('data-theme', theme);
      r.style.colorScheme = dark ? 'dark' : 'light';
    } catch (e) {}
  })();
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0f1720" media="(prefers-color-scheme: dark)" />
  <meta name="color-scheme" content="light dark" />
  <meta name="description" content="МелМК — расписание занятий: день и неделя, офлайн PWA." />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="МелМК" />
  <meta property="og:title" content="МелМК — Расписание" />
  <meta property="og:description" content="Удобное расписание МелМК для телефона и компьютера." />
  <meta property="og:type" content="website" />
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="./icons/icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./css/variables.css?v=13" />
  <link rel="stylesheet" href="./css/themes.css?v=13" />
  <link rel="stylesheet" href="./css/base.css?v=13" />
  <link rel="stylesheet" href="./css/layout.css?v=13" />
  <link rel="stylesheet" href="./css/schedule.css?v=13" />
  <link rel="stylesheet" href="./css/week.css?v=13" />
  <link rel="stylesheet" href="./css/effects.css?v=13" />
  <link rel="stylesheet" href="./css/animations.css?v=13" />
  <link rel="stylesheet" href="./css/melmk-ui.css?v=13" />
  <link rel="stylesheet" href="./css/week-badge-mode.css?v=13" />
  <title>МелМК — Расписание</title>
</head>
<body>
  <div class="mm-bg" aria-hidden="true">
    <span class="mm-bg__shape mm-bg__shape--1"></span>
    <span class="mm-bg__shape mm-bg__shape--2"></span>
    <span class="mm-bg__shape mm-bg__shape--3"></span>
    <span class="mm-bg__shape mm-bg__shape--4"></span>
    <span class="mm-bg__shape mm-bg__shape--5"></span>
    <span class="mm-bg__extra mm-bg__extra--shoot"></span>
  </div>

  <div class="app" id="app">
    <header class="app-header" role="banner">
      <div class="brand">
        <div class="brand__name">МелМК</div>
        <div class="brand__sub" id="brand-sub">Загрузка…</div>
      </div>
      <div class="header-actions no-print">
        <button type="button" class="btn btn--icon btn--ghost" id="btn-refresh" aria-label="Обновить" title="Обновить">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path d="M21 12a9 9 0 1 1-2.6-6.2"/><polyline points="21 3 21 9 15 9"/>

        <button type="button" class="btn btn--icon btn--ghost" id="btn-mood" aria-label="Тема оформления" title="Тема оформления" aria-haspopup="dialog">

          </svg>
        </button>
      </div>
    </header>

    <div id="banner-slot" class="no-print" style="padding: 0 12px;"></div>

    <main class="main" id="main" role="main" tabindex="-1">
      <p>Загрузка…</p>

    <nav class="bottom-nav no-print" role="navigation" aria-label="Основное меню">
      <a href="#tab=home" class="nav-item is-active" data-tab="home" aria-label="Расписание">

        </svg>
        <span>Расписание</span>
      </a>
      <a href="#tab=bells" class="nav-item" data-tab="bells" aria-label="Звонки">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.9 1.9 0 0 0 3.4 0"/>
        </svg>
        <span>Звонки</span>

      <a href="#tab=teachers" class="nav-item" data-tab="teachers" aria-label="Преподаватели">

          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
        </svg>
        <span class="nav-item__full">Преподаватели</span>
        <span class="nav-item__short" hidden>Препод.</span>
      </a>
    </nav>
  </div>

  <div id="toast-root" class="toast-root" aria-live="polite"></div>
  <script type="module" src="./js/app.js?v=13"></script>
