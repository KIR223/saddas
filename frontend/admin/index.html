<!DOCTYPE html>
<html lang="ru" data-theme="teal" data-mode="light">
<head>
  <meta charset="UTF-8" />
  <script>
  (function () {
    try {
      var mode = localStorage.getItem('mk_mode') || 'system';
      var theme = localStorage.getItem('mk_theme') || 'teal';
      var dark = mode === 'dark' ||
        (mode === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
      var r = document.documentElement;
      r.setAttribute('data-mode', dark ? 'dark' : 'light');
      r.setAttribute('data-theme', theme);
      r.style.colorScheme = dark ? 'dark' : 'light';
    } catch (e) {}
  })();
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#0d9488" />
  <meta name="color-scheme" content="light dark" />
  <meta name="description" content="Панель администратора МелМК" />
  <link rel="icon" href="../icons/icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="../css/variables.css?v=9" />
  <link rel="stylesheet" href="../css/themes.css?v=9" />
  <link rel="stylesheet" href="../css/base.css?v=9" />
  <link rel="stylesheet" href="../css/layout.css?v=9" />
  <link rel="stylesheet" href="admin.css?v=9" />
  <title>МелМК — Админ</title>
</head>
<body class="adm-body">
  <div id="login-screen" class="adm-login">
    <div class="adm-login__card">
      <h1 class="adm-login__title">МелМК</h1>
      <p class="adm-login__sub">Панель для преподавателей и админов</p>
      <form id="login-form" class="adm-form" autocomplete="on">
        <div class="field">
          <label for="login-user">Логин</label>
          <input id="login-user" name="username" type="text" autocomplete="username" required style="font-size:16px" />
        </div>
        <div class="field">
          <label for="login-pass">Пароль</label>
          <input id="login-pass" name="password" type="password" autocomplete="current-password" required style="font-size:16px" />
        </div>
        <p id="login-error" class="adm-login__error" role="alert" hidden></p>
        <button type="submit" class="btn btn--primary btn--block" id="login-submit">Войти</button>
      </form>
      <p class="adm-login__hint">Сессия 20 мин · после 5 ошибок — блокировка 5 мин</p>
    </div>
  </div>

  <div id="admin-app" class="adm-shell" hidden>
    <aside class="adm-sidebar no-print" aria-label="Меню администратора">
      <div class="adm-sidebar__brand">
        <span class="adm-sidebar__name">МелМК</span>
        <span class="adm-sidebar__badge">Админ</span>
      </div>
      <nav class="adm-sidebar__nav">
        <button type="button" class="adm-nav-btn is-active" data-section="home">Главная</button>
        <button type="button" class="adm-nav-btn" data-section="schedule">Расписание</button>
        <button type="button" class="adm-nav-btn" data-section="subs">Замены</button>
        <button type="button" class="adm-nav-btn" data-section="teachers">Преподаватели</button>
        <button type="button" class="adm-nav-btn" data-section="rooms">Кабинеты</button>
        <button type="button" class="adm-nav-btn" data-section="bells">Звонки</button>
        <button type="button" class="adm-nav-btn" data-section="data">Данные</button>
        <button type="button" class="adm-nav-btn" data-section="more">Ещё</button>
      </nav>
      <button type="button" class="btn btn--outline adm-sidebar__logout" id="btn-logout-sidebar">Выйти</button>
    </aside>

    <div class="adm-main-wrap">
      <header class="adm-header no-print">
        <h1 class="adm-header__title" id="adm-page-title">Главная</h1>
        <div class="adm-header__actions">
          <button type="button" class="btn btn--icon btn--ghost" id="btn-theme" aria-label="Сменить тему" title="Тема">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
            </svg>
          </button>
        </div>
      </header>
      <main class="adm-main" id="adm-content" role="main" tabindex="-1"></main>
    </div>

    <nav class="adm-bottom-nav no-print" aria-label="Навигация админки">
      <button type="button" class="adm-bottom-btn is-active" data-section="schedule">
        <span class="adm-bottom-btn__icon" aria-hidden="true">📅</span>
        <span>Пары</span>
      </button>
      <button type="button" class="adm-bottom-btn" data-section="subs">
        <span class="adm-bottom-btn__icon" aria-hidden="true">⇄</span>
        <span>Замены</span>
      </button>
      <button type="button" class="adm-bottom-btn" data-section="teachers">
        <span class="adm-bottom-btn__icon" aria-hidden="true">👤</span>
        <span>Преп.</span>
      </button>
      <button type="button" class="adm-bottom-btn" data-section="rooms">
        <span class="adm-bottom-btn__icon" aria-hidden="true">🚪</span>
        <span>Каб.</span>
      </button>
      <button type="button" class="adm-bottom-btn" data-section="more">
        <span class="adm-bottom-btn__icon" aria-hidden="true">⋯</span>
        <span>Ещё</span>
      </button>
    </nav>
  </div>

  <div id="toast-root" class="toast-root" aria-live="polite"></div>
  <script type="module" src="admin-app.js?v=8"></script>
</body>
</html>
